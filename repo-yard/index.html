<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Repo Yard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: the 3D yard is the playfield; KPIs, layers and camera controls float on it like a strategy-game HUD.
   Ops panels dock right (context) and below (live feed + commit trace). Stacks to one column on phones. */
:root{
  --bg:#e8ecf0; --surface:#ffffff; --surface-2:#f3f5f8; --surface-3:#eaeef2;
  --line:#dbe1e7; --line-strong:#c3ccd5;
  --fg:#15202b; --muted:#566370; --faint:#86929e;
  --accent:#2853c7; --accent-soft:#e2e9fb; --accent-fg:#ffffff;
  --safety:#d9661a; --safety-soft:#fcebdc;
  --ok:#15875a; --ok-soft:#dcf1e7; --warn:#a87708; --warn-soft:#f9eed2; --crit:#c93636; --crit-soft:#fae2e2;
  --jenkins:#b04f29; --newci:#0d817e;
  --av-s:55%; --av-l:86%; --av-fl:28%;
  --shadow:0 1px 2px rgba(21,32,43,.06),0 6px 18px rgba(21,32,43,.07);
  --font-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d131a; --surface:#151c25; --surface-2:#1a2330; --surface-3:#202b39;
  --line:#26313f; --line-strong:#34414f;
  --fg:#e5eaf0; --muted:#97a3b0; --faint:#6c7987;
  --accent:#7196ff; --accent-soft:#1e2c4d; --accent-fg:#0d131a;
  --safety:#ff9348; --safety-soft:#3a2617;
  --ok:#3fcf94; --ok-soft:#173327; --warn:#eab53c; --warn-soft:#382d14; --crit:#ff6b6b; --crit-soft:#3d1d20;
  --jenkins:#e47d50; --newci:#3ec8c4;
  --av-s:40%; --av-l:30%; --av-fl:84%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d131a; --surface:#151c25; --surface-2:#1a2330; --surface-3:#202b39;
  --line:#26313f; --line-strong:#34414f;
  --fg:#e5eaf0; --muted:#97a3b0; --faint:#6c7987;
  --accent:#7196ff; --accent-soft:#1e2c4d; --accent-fg:#0d131a;
  --safety:#ff9348; --safety-soft:#3a2617;
  --ok:#3fcf94; --ok-soft:#173327; --warn:#eab53c; --warn-soft:#382d14; --crit:#ff6b6b; --crit-soft:#3d1d20;
  --jenkins:#e47d50; --newci:#3ec8c4;
  --av-s:40%; --av-l:30%; --av-fl:84%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}

/* ---------- app grid ---------- */
.app{display:grid;height:100%;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr) 248px;
  grid-template-areas:"top top" "stage side" "bottom side"}
.top{grid-area:top;display:flex;align-items:center;gap:20px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.logo{width:28px;height:28px}
.brand-name{font-family:var(--font-display);font-weight:800;font-stretch:118%;font-size:18px;letter-spacing:-.01em}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;font-size:14px}
.crumbs button{background:none;border:0;padding:4px 6px;border-radius:6px;cursor:pointer;color:var(--muted)}
.crumbs button:hover{background:var(--surface-2);color:var(--fg)}
.crumbs .sep{color:var(--faint)}
.crumbs .here{font-weight:700;padding:4px 6px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.demo-chip{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:4px 8px;border-radius:999px}
.sim{display:flex;align-items:center;gap:6px}
.icon-btn{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:14px;height:14px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:4px 9px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:600;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.clock{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-weight:600;color:var(--ok);background:var(--ok-soft);padding:5px 10px;border-radius:999px;font-size:12px}
.clock .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:blink 1.6s infinite}
.clock.paused{color:var(--muted);background:var(--surface-2)}
.clock.paused .dot{background:var(--faint);animation:none}
@keyframes blink{50%{opacity:.3}}

/* ---------- stage ---------- */
.stage{grid-area:stage;position:relative;overflow:hidden;min-height:0;background:var(--bg)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.stage canvas.dragging{cursor:grabbing}
.stage canvas.pointer{cursor:pointer}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fatal{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);padding:24px;text-align:center}

.kpis{grid-area:stage;align-self:start;justify-self:start;z-index:3;margin:14px;display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100% - 90px);pointer-events:none}
.kpi{pointer-events:auto;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px 12px 9px;min-width:112px;box-shadow:var(--shadow)}
.kpi .k-label{font-size:11.5px;color:var(--muted);font-weight:500}
.kpi .k-val{font-family:var(--font-display);font-stretch:112%;font-weight:750;font-size:21px;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .k-val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .k-sub{font-size:11px;color:var(--faint);margin-top:1px}
.kpi.alert{border-color:color-mix(in srgb,var(--safety) 45%,var(--line))}
.kpi.alert .k-val{color:var(--safety)}
.kpi .k-sub b{font-weight:600;color:var(--warn)}

.camnav{grid-area:stage;align-self:start;justify-self:end;z-index:3;margin:14px;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
.camnav button{width:34px;height:34px;border:0;background:none;border-radius:8px;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.camnav button:hover{background:var(--surface-2);color:var(--fg)}
.camnav svg{width:16px;height:16px}

.hud-bottom{grid-area:stage;align-self:end;z-index:3;margin:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none}
.hud-bottom>*{pointer-events:auto}
.layers{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.layers .l-title{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:0 6px}
.chip-btn{border:1px solid transparent;background:none;padding:6px 10px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip-btn:hover{background:var(--surface-2);color:var(--fg)}
.chip-btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.chip-btn .sw{width:9px;height:9px;border-radius:3px;background:currentColor;opacity:.85}
.layers .divider{width:1px;height:20px;background:var(--line);margin:0 4px}
.legend{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow);font-size:11.5px;color:var(--muted);max-width:310px;display:grid;gap:6px}
.legend summary{cursor:pointer;font-weight:600;color:var(--fg);list-style:none;display:flex;align-items:center;gap:6px;font-size:12px}
.legend summary::-webkit-details-marker{display:none}
.legend summary::before{content:"";width:6px;height:6px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .2s;margin-right:2px}
.legend details[open] summary::before{transform:rotate(45deg)}
.legend details[open] summary{margin-bottom:6px}
.legend #legend-body{display:grid;gap:4px}
#legend-key:empty{display:none}
.legend b{color:var(--fg);font-weight:600}
.legend .ramp{height:6px;border-radius:3px;margin:3px 0 1px}
.legend .ramp-lbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint)}
.legend .teams{display:flex;flex-wrap:wrap;gap:4px 10px}
.legend .teams span{display:inline-flex;align-items:center;gap:5px}
.legend .teams i{width:9px;height:9px;border-radius:3px;display:inline-block}

.hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:11.5px;padding:5px 10px;border-radius:999px;opacity:.82;pointer-events:none;transition:opacity .6s;white-space:nowrap;z-index:2}
.hint.gone{opacity:0}

/* ---------- 3D labels ---------- */
.lbl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform;font-size:11px;line-height:1.25}
.lbl-district{font-family:var(--font-mono);font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.02em;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 6px var(--bg)}
.lbl-card{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:3px 7px 4px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.lbl-branch{pointer-events:auto;cursor:pointer;display:grid;gap:1px}
.lbl-branch .b-name{font-family:var(--font-mono);font-weight:600;font-size:10.5px}
.lbl-branch .b-meta{color:var(--muted);font-size:10.5px;display:flex;gap:6px;align-items:center}
.lbl-branch.stale{opacity:.72}
.lbl-branch.stale .b-name{color:var(--muted)}
.lbl-branch.hl{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.lbl-main{font-family:var(--font-display);font-stretch:112%;font-weight:750;font-size:12.5px;padding:4px 9px}
.lbl-main span{font-family:var(--font-mono);font-weight:500;font-size:10.5px;color:var(--muted);margin-left:6px}
.lbl-spark{background:var(--safety);color:#fff;border-radius:999px;padding:2px 8px;font-weight:700;font-size:10.5px;pointer-events:auto;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.lbl-spark.stale{background:var(--surface);color:var(--safety);border:1px dashed var(--safety)}
.lbl-strain{color:var(--warn);font-family:var(--font-mono);font-size:10px;font-weight:600;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg)}
.lbl-hot{background:var(--crit);color:#fff;border-radius:6px;padding:2px 6px;font-family:var(--font-mono);font-size:10px;font-weight:600}
.lbl-stage{font-weight:600}
.lbl-stage b{color:var(--accent)}
.lbl-repo{pointer-events:auto;cursor:pointer;text-align:center;padding:5px 10px 6px}
.lbl-repo .r-name{font-family:var(--font-display);font-stretch:110%;font-weight:750;font-size:13px}
.lbl-repo .r-meta{color:var(--muted);font-size:10.5px;display:flex;gap:6px;justify-content:center;align-items:center}
.lbl-pipe{font-family:var(--font-mono);font-size:10px;font-weight:600;color:var(--safety);background:var(--surface);border:1px solid var(--safety);border-radius:6px;padding:2px 6px}
.lbl-fog{font-size:10.5px;font-weight:600;color:var(--muted);font-style:italic;text-shadow:0 0 4px var(--bg),0 0 4px var(--bg)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface-3);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.safety{background:var(--safety-soft);color:var(--safety)}
.pill.jenkins{background:color-mix(in srgb,var(--jenkins) 14%,transparent);color:var(--jenkins)}
.pill.newci{background:color-mix(in srgb,var(--newci) 14%,transparent);color:var(--newci)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--ok)} .dot.crit{background:var(--crit)} .dot.warn{background:var(--warn)}
.dot.run{background:var(--accent);animation:blink 1s infinite}

/* ---------- tooltip & toasts ---------- */
.tip{position:absolute;z-index:6;pointer-events:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);max-width:290px;font-size:12px}
.tip h4{margin:0 0 4px;font-size:13px;font-family:var(--font-mono);font-weight:600;word-break:break-all}
.tip .t-row{display:flex;justify-content:space-between;gap:14px;color:var(--muted)}
.tip .t-row b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.tip .t-note{margin-top:6px;color:var(--muted)}
.tip .t-note.safety{color:var(--safety);font-weight:600}
.tip ul{margin:4px 0 0;padding-left:16px;color:var(--fg)}
.toasts{position:absolute;right:14px;bottom:110px;z-index:6;display:grid;gap:8px;width:min(330px,calc(100% - 28px))}
.toast{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:9px 12px;box-shadow:var(--shadow);font-size:12px;animation:toastIn .3s ease-out}
.toast.safety{border-left-color:var(--safety)} .toast.crit{border-left-color:var(--crit)} .toast.ok{border-left-color:var(--ok)}
.toast b{display:block;font-size:12.5px;margin-bottom:2px}
.toast .mono{font-size:11px}
@keyframes toastIn{from{transform:translateY(-6px);opacity:0}}

/* ---------- side panel ---------- */
.side{grid-area:side;background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;min-height:0}
.side section{padding:16px 18px;border-bottom:1px solid var(--line)}
.side h2{margin:0;font-family:var(--font-display);font-stretch:115%;font-weight:800;font-size:21px;letter-spacing:-.01em;text-wrap:balance}
.side h3{margin:0 0 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
.side h3 .count{background:var(--surface-3);color:var(--fg);border-radius:999px;padding:1px 7px;font-size:10.5px;letter-spacing:0}
.side h3 .count.safety{background:var(--safety);color:#fff}
.side h3 .h-aside{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:var(--faint);font-size:11px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:3px}
.repo-meta{color:var(--muted);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.back{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;margin-bottom:10px;display:inline-flex;gap:4px;align-items:center}
.back:hover{text-decoration:underline}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.stat{background:var(--surface-2);border-radius:10px;padding:8px 11px}
.stat .s-l{font-size:11px;color:var(--muted)}
.stat .s-v{font-family:var(--font-display);font-stretch:110%;font-weight:750;font-size:19px;font-variant-numeric:tabular-nums}
.stat .s-v small{font-size:12px;color:var(--muted);font-weight:600;margin-left:3px}
.stat.safety .s-v{color:var(--safety)}

.empty{color:var(--faint);font-size:12px;padding:4px 0}
.conflict{display:grid;gap:5px;padding:9px 11px;border-radius:10px;background:var(--safety-soft);border-left:4px solid var(--safety);cursor:pointer;margin-bottom:8px;text-align:left;border-top:0;border-right:0;border-bottom:0;width:100%}
.conflict:hover{filter:brightness(.98)}
.conflict.stale{background:var(--surface-2);border-left-color:var(--line-strong)}
.conflict .c-pair{font-family:var(--font-mono);font-size:11px;font-weight:600;display:grid;gap:1px;word-break:break-all}
.conflict .c-pair i{font-style:normal;color:var(--muted);font-weight:400;font-family:var(--font-body)}
.conflict .c-files{font-size:11.5px;color:var(--muted)}
.conflict .c-files b{color:var(--fg);font-family:var(--font-mono);font-weight:500;font-size:11px}

.lane{margin-bottom:12px}
.lane-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;margin-bottom:6px}
.lane-h .bar{width:3px;height:14px;border-radius:2px;background:var(--faint)}
.lane-h .n{color:var(--faint);font-weight:500}
.pr{display:grid;gap:4px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;background:var(--surface);text-align:left;width:100%}
.pr:hover{border-color:var(--line-strong);background:var(--surface-2)}
.pr.hl{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.pr .p-top{display:flex;gap:8px;align-items:baseline}
.pr .p-n{font-family:var(--font-mono);font-size:11px;color:var(--muted);flex:none}
.pr .p-title{font-weight:600;font-size:12.5px;min-width:0}
.pr .p-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:11.5px}
.pips{display:inline-flex;gap:3px;align-items:center}
.pips i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line-strong);display:inline-block}
.pips i.ok{background:var(--ok);border-color:var(--ok)}
.pips i.x{background:var(--crit);border-color:var(--crit)}
.diff{font-family:var(--font-mono);font-size:10.5px}
.diff .a{color:var(--ok)} .diff .d{color:var(--crit)}
.av{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:9px;font-weight:700;letter-spacing:.02em;background:hsl(var(--h) var(--av-s) var(--av-l));color:hsl(var(--h) 50% var(--av-fl));flex:none}
.av.lg{width:26px;height:26px;font-size:10px}

.rq{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0}
.rq .rq-name{font-weight:600;font-size:12.5px}
.rq .rq-sub{font-size:11px;color:var(--muted)}
.crates{display:flex;gap:2px}
.crates i{width:10px;height:10px;border-radius:2px;background:var(--line-strong)}
.crates i.on{background:var(--accent)}
.crates i.old{background:var(--warn)}
.side .caption{font-size:11px;color:var(--faint);margin-top:8px}

.btable{width:100%;border-collapse:collapse;font-size:12px}
.btable th{text-align:left;font-size:10.5px;color:var(--faint);font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:0 6px 6px 0}
.btable td{padding:6px 6px 6px 0;border-top:1px solid var(--line);vertical-align:top}
.btable tr{cursor:pointer}
.btable tr:hover td{background:var(--surface-2)}
.btable .bn{font-family:var(--font-mono);font-size:11px;word-break:break-all}
.btable .ab{font-family:var(--font-mono);font-size:11px;white-space:nowrap}
.btable .ab .behind-hi{color:var(--warn);font-weight:600}
.tbl-wrap{overflow-x:auto}

.staged-list{display:grid;gap:6px;margin-bottom:10px}
.staged-item{display:flex;gap:8px;align-items:baseline;font-size:12px}
.staged-item .mono{color:var(--muted);font-size:11px;flex:none}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;cursor:pointer;font-size:12.5px}

function startPrBuild(repo, b, c) {

  emit('pr', repo, { branch: b });
  after(rnd(3, 7), () => {
    const pass = Math.random() < .86;
    if (c) { c.build.status = pass ? 'passed' : 'failed'; c.build.end = sim.now; }
    if (!repo.branches.includes(b) || !b.pr) return;
    b.pr.ci = pass ? 'passing' : 'failing';
    if (pass && b.pr.state === 'in_review' && approvals(b.pr) >= 2) b.pr.state = 'approved';
    if (!pass) {

function doPush(repo, forced, forcedMsg) {

function doReview(repo) {

function doOpenPr(repo) {

function doNewBranch(repo) {

function doDeleteStale(repo) {

function doDepBump(repo) {

    [4, () => doReady(repo)], [5, () => doNewBranch(repo)], [4, () => doSyncMain(repo)], [4, () => doRelease(repo, false)],

    for (; i < pool.length - 1; i++) { x -= pool[i][0]; if (x <= 0) break; }
    if (pool[i][1]()) return;
    pool.splice(i, 1);
  }

function simTick(dtMin) {
  sim.now += dtMin;
  const hour = Math.floor(sim.now / 60);
  if (sim.lastHour == null) sim.lastHour = hour;
  if (hour !== sim.lastHour) { sim.lastHour = hour; for (const r of state.repos) { r.hourly.push(0); r.hourly.shift(); } }
  const k = Math.exp(-dtMin / 90);
  for (const r of state.repos) for (const f of r.files) f.heat *= k;
  for (let i = timers.length - 1; i >= 0; i--) if (timers[i].at <= sim.now) { const t = timers.splice(i, 1)[0]; t.fn(); }
  if (sim.now >= sim.nextEventAt) { fireEvent(); sim.nextEventAt = sim.now + rnd(1.3, 3); }
}

/* ================================================================
   Repo view: the campus (main branch) + construction sites (branches)
   ================================================================ */
let RS = null;   // repo-scene refs
let TS = null;   // town-scene refs
function treemap(items, x, z, w, d, out) {
  if (!items.length) return;
  if (items.length === 1) { out.push({ ref: items[0].ref, x, z, w, d }); return; }
  const total = sum(items.map(i => i.w)); let acc = 0, i = 0;
  while (i < items.length - 1 && acc + items[i].w <= total / 2) { acc += items[i].w; i++; }
  if (i === 0) { acc = items[0].w; i = 1; }
  const f = acc / total, a = items.slice(0, i), b = items.slice(i);
  if (w >= d) { treemap(a, x, z, w * f, d, out); treemap(b, x + w * f, z, w * (1 - f), d, out); }
  else { treemap(a, x, z, w, d * f, out); treemap(b, x, z + d * f, w, d * (1 - f), out); }
}
const fileHeight = f => .7 + Math.sqrt(f.loc) / 6.6;

function buildRepoScene(repo) {

function buildCampus(repo) {
  const g = layer('campus');
  const items = repo.districts.map(d => ({ w: d.files.length + 1.3, ref: d })).sort((a, b) => b.w - a.w);
  const area = sum(items.map(i => i.w)) * 15;
  const W = Math.sqrt(area * 1.5), D = area / W;
  const rects = []; treemap(items, -W / 2, -D / 2, W, D, rects);
  RS.campus = { W, D, hx: W / 2 + 2.5, hz: D / 2 + 2.5 };
  const slab = box(W + 5, .8, D + 5, M(P.plate)); slab.position.y = .4; g.add(slab);
  const fog = layer('fog');
  for (const r of rects) {
    const d = r.ref, gap = .8;
    const x = r.x + gap / 2, z = r.z + gap / 2, w = r.w - gap, dd = r.d - gap;
    const plate = box(w, .3, dd, M(P.tints[d.idx % P.tints.length])); plate.position.set(x + w / 2, .95, z + dd / 2); g.add(plate);
    addLabel(`${esc(d.path)}/`, new THREE.Vector3(x + .2, 1.15, z + dd - .15), 'campus', 'lbl-district', { anchor: 'left' });
    const n = d.files.length, cols = Math.max(1, Math.round(Math.sqrt(n * w / dd))), rows = Math.ceil(n / cols);
    const cw = w / cols, cd = dd / rows, fp = Math.min(cw, cd, 4.8) * .7;
    d.files.forEach((fid, i) => {
      const f = repo.fileById[fid], c = i % cols, rr = Math.floor(i / cols), h = fileHeight(f);
      const m = box(fp, h, fp, M(P.file, { emissive: 0x000000 }));
      m.position.set(x + cw * (c + .5), 1.1 + h / 2, z + cd * (rr + .5));
      g.add(pickable(m, { layer: 'campus', kind: 'file', id: fid }));
      RS.fileMesh[fid] = m; RS.fileTop[fid] = new THREE.Vector3(m.position.x, 1.1 + h, m.position.z);
      f.flash = 0; f.flashColor = new THREE.Color(P.hl);
    });

        const s = new THREE.Mesh(new THREE.SphereGeometry(rnd(1.6, 2.6), 14, 10), cm);
        s.position.set(x + w * (.15 + .7 * Math.random()), rnd(5, 7.5), z + dd * (.15 + .7 * Math.random()));

  for (const { f } of ranked) addLabel(`${esc(f.name)} · ${f.churn} changes/30d`, RS.fileTop[f.id].clone().add(new THREE.Vector3(0, .8, 0)), 'campus', 'lbl-hot', { when: () => state.layer === 'hotspots' });

function hotScore(repo, f) {

/* ---------- branches as construction sites ---------- */
function scaffoldGeometry(w, h, d, step) {
  const v = [], hw = w / 2, hd = d / 2;
  const posts = [[-hw, -hd], [hw, -hd], [hw, hd], [-hw, hd]];
  if (w > 4.5) posts.push([0, -hd], [0, hd]);
  if (d > 4.5) posts.push([-hw, 0], [hw, 0]);
  for (const [x, z] of posts) v.push(x, 0, z, x, h, z);
  for (let y = step; y <= h + .01; y += step) {
    for (let i = 0; i < 4; i++) { const a = posts[i], b = posts[(i + 1) % 4]; v.push(a[0], y, a[1], b[0], y, b[1]); }
  }
  // diagonal bracing on two faces
  for (let y = 0; y + step <= h + .01; y += step) { v.push(-hw, y, hd, hw, y + step, hd); v.push(hw, y, -hd, hw, y + step, hd); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3)); return g;
}

  else if (stale) meta = `${avatar(b.author)} <span class="pill">stale ${fmtAge(sim.now - b.last)}</span>`;

    const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 64, .38, 10, false), M(color, { emissive: a.behind ? new THREE.Color(P.spark) : new THREE.Color(0), emissiveIntensity: a.behind ? .25 : 0 }));
    tube.castShadow = true;
    g.add(pickable(tube, { layer: 'pipes', kind: 'pipe', lib: a.lib.id, consumer: a.consumer.id }));
    const balls = [];
    for (let k = 0; k < 4; k++) { const b = new THREE.Mesh(new THREE.SphereGeometry(.5, 10, 8), MB(a.behind ? P.spark : P.hl)); g.add(b); balls.push(b); }
    addTicker('pipes', t => balls.forEach((b, k) => b.position.copy(curve.getPoint(((t * .12) + k / balls.length) % 1))));
    if (a.behind) addLabel(`${esc(a.consumer.id)} on ${esc(a.have)} · latest ${esc(a.want)}`, curve.getPoint(.5).add(new THREE.Vector3(0, 1.2, 0)), 'pipes', 'lbl-pipe');

  }

  }

function kpi(label, val, sub, alert) { return `<div class="kpi${alert ? ' alert' : ''}"><div class="k-label">${label}</div><div class="k-val">${val}</div><div class="k-sub">${sub}</div></div>`; }
function renderKpis() {

  const active = sum(repos.map(x => x.branches.filter(isActive).length));
  const stale = sum(repos.map(x => x.branches.filter(isStale).length));
  const prs = sum(repos.map(x => openPrs(x).length));
  const waits = reviewWaits(repos);
  const slow = waits.filter(w => w > DAY).length;
  const conf = sum(repos.map(x => collisions(x).filter(c => !c.stale).length));
  const staged = sum(repos.map(x => x.staged.length));
  const lastHour = sum(repos.map(x => commitsSince(x, 60)));
  let html = '';
  if (!r) html += kpi('Commits, last hour', lastHour, `across ${state.repos.length} repos`);

  html += kpi('Median review wait', fmtWait(median(waits)), `${waits.length} PRs awaiting review`);
  if (r) html += kpi('Staged for release', staged, `merged, not in production`);

  <section>
    <h3>Branches <span class="count">${r.branches.length}</span></h3>
    <div class="tbl-wrap"><table class="btable"><thead><tr><th>Branch</th><th>Ahead / behind</th><th>Last commit</th></tr></thead><tbody>
    ${branches.map(b => `<tr data-action="focus-branch" data-id="${esc(b.name)}"><td class="bn">${esc(b.name)}${isStale(b) ? ' <span class="pill">stale</span>' : ''}</td><td class="ab">${b.ahead} / <span class="${b.behind > 40 ? 'behind-hi' : ''}">${b.behind}</span></td><td class="num" style="white-space:nowrap">${fmtAge(sim.now - b.last)}</td></tr>`).join('')}
    </tbody></table></div>
  </section>`;
}
function sparkline(vals) {
  const w = 64, h = 22, max = Math.max(3, ...vals);
  const pts = vals.map((v, i) => [i / (vals.length - 1) * w, h - 2 - v / max * (h - 5)]);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('');
  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-label="Commits per hour, last 12 hours"><path d="${d}L${w},${h}L0,${h}Z" fill="var(--accent-soft)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.4"/><circle cx="${last[0]}" cy="${last[1]}" r="2.2" fill="var(--accent)"/></svg>`;
}
function townPanel() {
  const moved = state.repos.filter(r => r.ci === 'newci');
  const deps = depAlerts();
  const repos = state.repos.slice().sort((a, b) => collisions(b).filter(c => !c.stale).length - collisions(a).filter(c => !c.stale).length || commitsSince(b, 120) - commitsSince(a, 120));
  return `
  <section>
    <div class="eyebrow">Engineering · all teams</div>
    <h2>All repositories</h2>
    <div class="repo-meta">${state.repos.length} repos · ${Object.keys(TEAMS).length} teams. Click a building or a row to open a repo.</div>
  </section>
  <section class="mig">
    <h3>Jenkins → new CI/CD</h3>
    <div class="m-top"><div class="m-big">${moved.length}<small> of ${state.repos.length} repos moved</small></div><span class="pill">target Dec 15</span></div>
    <div class="progress" role="img" aria-label="${moved.length} of ${state.repos.length} migrated"><i style="width:${moved.length / state.repos.length * 100}%"></i></div>
    <div class="m-row">${state.repos.map(r => `<span class="pill ${r.ci}">${esc(r.id)}</span>`).join('')}</div>
  </section>
  <section>
    <h3>Shared library versions</h3>
    ${deps.map(a => `<div class="dep"><div class="d-top"><span>${esc(a.consumer.id)}</span><span class="pill ${a.behind ? 'safety' : 'ok'}">${a.behind ? 'needs bump' : 'up to date'}</span></div><div class="d-sub"><span class="mono">${esc(a.lib.id)}</span> ${esc(a.have)}${a.behind ? ` → ${esc(a.want)}` : ''}${a.bumpBranch ? ` · bump in progress (${a.bumpBranch.pr ? '#' + a.bumpBranch.pr.n : 'no PR yet'})` : ''}</div></div>`).join('')}
  </section>
  <section style="padding-bottom:8px">
    <h3>Repositories <span class="h-aside">commits/hour, last 12h</span></h3>
    ${repos.map(r => {
      const cr = collisions(r).filter(c => !c.stale).length;
      const st = r.lastBuild ? r.lastBuild.status : 'passed';
      return `<button class="repo-row" data-action="enter-repo" data-id="${r.id}"><div class="rr-name">${esc(r.id)}</div><span class="dot ${st === 'running' ? 'run' : st === 'failed' ? 'crit' : 'ok'}" title="main build ${st}"></span>${sparkline(r.hourly)}
        <div class="rr-sub"><span class="pill ${r.ci}">${r.ci === 'jenkins' ? 'Jenkins' : 'New CI'}</span><span>${TEAMS[r.team].name}</span><span>${r.branches.filter(isActive).length} branches · ${openPrs(r).length} PRs · ${r.staged.length} staged</span>${cr ? `<span class="pill safety">${cr} conflict risk${cr > 1 ? 's' : ''}</span>` : ''}</div></button>`;
    }).join('')}
  </section>`;
}

/* ---------- live feed ---------- */
function feedItemHtml(it, fresh) {
  return `<li class="ev${fresh ? ' fresh' : ''}"><time>${fmtClock(it.t)}</time><span class="ic ${it.cls || ''}">${ICON[it.icon] || ''}</span><div class="e-body"><span class="e-repo">${esc(it.repo)}</span> <span class="e-text">${it.html}</span>${it.sha ? ` <button class="sha${state.selectedSha === it.sha ? ' sel' : ''}" data-action="trace" data-id="${it.sha}">${it.sha}</button>` : ''}</div></li>`;
}
function renderFeed() { $('#feed').innerHTML = state.feed.slice(0, 60).map(it => feedItemHtml(it, false)).join(''); }
function prependFeed(it) {
  const ol = $('#feed');
  ol.insertAdjacentHTML('afterbegin', feedItemHtml(it, true));
  while (ol.children.length > 60) ol.lastElementChild.remove();
}
function seedFeed() {
  const all = [];
  for (const r of state.repos) for (const sha of r.log) { const c = state.commits.get(sha); if (sim.now - c.t < 300 && c.kind !== 'merge' || (c.kind === 'merge' && sim.now - c.t < 300 && c.pr)) all.push(c); }
  all.sort((a, b) => b.t - a.t);
  state.feed = all.slice(0, 24).map(c => c.kind === 'merge'
    ? { id: c.sha, t: c.t, repo: c.repo, icon: 'merge', cls: 'ok', html: `${nm(c.author)} merged #${c.pr} ${esc(c.msg)} into ${code('main')}`, sha: c.sha }
    : { id: c.sha, t: c.t, repo: c.repo, icon: 'push', cls: 'accent', html: `${nm(c.author)} pushed to ${code(c.branch)}: ${esc(c.msg)}`, sha: c.sha });
}

/* ---------- follow a commit ---------- */
function traceSteps(c) {
  const repo = state.byId[c.repo];
  const m = c.kind === 'merge' ? c : (c.mergeSha ? state.commits.get(c.mergeSha) : null);
  const b = c.kind === 'push' ? repo.branches.find(x => x.name === c.branch) : null;
  const pr = b && b.pr;
  const S = [];
  S.push({ k: 'commit', l: 'Committed', s: `${esc(firstName(c.author))} · ${fmtWhen(c.t)}`, st: 'done' });
  if (m) {
    S.push({ k: 'pr', l: 'Pull request', s: `#${m.pr} opened`, st: 'done' });
    S.push({ k: 'review', l: 'Review', s: `${m.approvals || 2} approvals`, st: 'done' });
    S.push({ k: 'merge', l: 'Merged to main', s: `${fmtWhen(m.t)} · <span class="mono">${m.sha}</span>`, st: 'done' });
    const bd = m.build;
    if (!bd) S.push({ k: 'build', l: 'Build', s: 'queued', st: 'pending' });
    else S.push({ k: 'build', l: 'Build', s: `${esc(ciLabel(repo, bd.id))} ${bd.status === 'running' ? 'running' : bd.status === 'failed' ? 'failed, retrying' : `passed in ${Math.max(1, Math.round(bd.end - bd.start))}m`}`, st: bd.status === 'running' ? 'active' : bd.status === 'failed' ? 'failed' : 'done' });
    S.push({ k: 'image', l: 'Image', s: m.image ? `<span class="mono">sha-${m.sha}</span>` : 'after build', st: m.image ? 'done' : 'pending', mono: true });
    S.push({ k: 'staging', l: 'Staging', s: m.staging ? `deployed ${fmtWhen(m.staging)}` : m.image ? 'deploying' : 'after image', st: m.staging ? 'done' : m.image ? 'active' : 'pending' });
    S.push({ k: 'prod', l: 'Production', s: m.prod ? `v${esc(m.prodVersion)} · ${fmtWhen(m.prod)}` : m.staging ? 'waiting for the next release' : 'after staging', st: m.prod ? 'done' : m.staging ? 'blocked' : 'pending' });
  } else {
    if (!pr) S.push({ k: 'pr', l: 'Pull request', s: b ? 'not opened yet' : 'branch was deleted', st: b ? 'blocked' : 'pending' });
    else S.push({ k: 'pr', l: 'Pull request', s: `#${pr.n} ${pr.state === 'draft' ? 'draft' : 'open'}`, st: pr.state === 'draft' ? 'blocked' : 'done' });
    if (!pr || pr.state === 'draft') S.push({ k: 'review', l: 'Review', s: 'not requested', st: 'pending' });
    else if (pr.state === 'changes_requested') S.push({ k: 'review', l: 'Review', s: 'changes requested', st: 'blocked' });
    else if (pr.state === 'approved') S.push({ k: 'review', l: 'Review', s: `${approvals(pr)} of 2 approvals`, st: 'done' });
    else S.push({ k: 'review', l: 'Review', s: `${approvals(pr)} of 2 approvals · waiting ${fmtWait(sim.now - pr.requestedAt)}`, st: 'active' });
    const ready = pr && pr.state === 'approved' && pr.ci === 'passing';
    S.push({ k: 'merge', l: 'Merged to main', s: ready ? 'ready to merge' : pr && pr.ci === 'failing' ? 'blocked by failing CI' : 'not yet', st: ready ? 'active' : pr && pr.ci === 'failing' ? 'failed' : 'pending' });
    S.push({ k: 'build', l: 'Build', s: c.build ? `PR check ${esc(ciLabel(repo, c.build.id))} ${c.build.status}` : 'on merge', st: 'pending' });
    S.push({ k: 'image', l: 'Image', s: 'after main build', st: 'pending' });
    S.push({ k: 'staging', l: 'Staging', s: 'after image', st: 'pending' });
    S.push({ k: 'prod', l: 'Production', s: 'next release', st: 'pending' });
  }
  return S;
}
function renderTrace() {
  const el = $('#trace');
  const c = state.selectedSha && state.commits.get(state.selectedSha);
  if (!c) { el.innerHTML = '<div class="empty" style="padding:0 16px">Pick a commit id in the feed or the panel to see where it is on its way to production.</div>'; return; }
  const repo = state.byId[c.repo];
  const steps = traceSteps(c);
  const icon = { commit: 'commit', pr: 'pr', review: 'review', merge: 'merge', build: 'build', image: 'image', staging: 'staging', prod: 'prod' };
  const here = curRepo() && curRepo().id === repo.id;
  el.innerHTML = `<div class="trace-head"><div class="t-title"><div class="t-msg">${esc(c.msg)}</div>
    <div class="t-sub"><span class="mono">${c.sha}</span><span>·</span><b>${esc(repo.id)}</b><span>·</span><span class="mono">${esc(c.kind === 'merge' ? 'main' : c.branch)}</span><span>·</span><span>${c.files.length} file${c.files.length === 1 ? '' : 's'}</span></div></div>
    <button class="btn" data-action="show-in-yard">${here ? 'Highlight in yard' : `Open ${esc(repo.id)}`}</button></div>
    <div class="steps-scroll"><div class="steps">${steps.map(s => `<div class="step ${s.st}"><div class="s-dot">${s.st === 'failed' ? ICON.fail : s.st === 'blocked' ? ICON.wait : ICON[icon[s.k]]}</div><div class="s-l">${s.l}</div><div class="s-sub">${s.s}</div></div>`).join('')}</div></div>`;
}

/* ---------- toasts ---------- */
function toast(o) {
  const el = document.createElement('div');
  el.className = `toast ${o.cls || ''}`;
  el.innerHTML = `<b>${esc(o.title)}</b>${o.body}`;
  const box = $('#toasts');
  box.prepend(el);
  while (box.children.length > 3) box.lastElementChild.remove();
  setTimeout(() => el.remove(), 7000);
}
/* ================================================================
   Wiring: sim events → 3D + panels
   ================================================================ */
emit = (type, repo, data) => {
  const inRepo = RS && RS.repo === repo;
  switch (type) {
    case 'feed': prependFeed(data); break;
    case 'toast': toast(data); break;
    case 'push': if (inRepo) fxPush(repo, data.branch, data.files); break;
    case 'merge':
      if (inRepo) fxMerge(repo, data.branch, data.files);
      if (TS) { refreshTownBuilding(repo); if (data.branch.bump) buildPipes(); }
      break;
    case 'release':
      if (inRepo) fxRelease(repo);
      if (TS && repo.lib) buildPipes();
      break;
    case 'branches': case 'pr':
      if (inRepo) RS.dirty = true;
      if (TS && (type === 'branches')) refreshTownBuilding(repo);
      break;
    case 'build': case 'deploy':
      if (inRepo && RS.stageLabel) RS.stageLabel.el.innerHTML = stageLabelHtml(repo);
      break;
  }
  if (TS && (type === 'push' || type === 'pr') && TS.bld[repo.id]) {
    const b = TS.bld[repo.id];
    b.label.el.innerHTML = townLabelHtml(repo);
    if (repo.branches.filter(isActive).length !== b.lit || (collisions(repo).some(c => !c.stale) !== !!b.label.el.querySelector('.safety'))) refreshTownBuilding(repo);
  }
  ui.dirty = true;
};

/* ---------- view switching ---------- */
function enterRepo(id, keepCamera) {
  state.view = { mode: 'repo', repoId: id };
  state.focusBranch = null; state.hoverBranch = null; state.hoverFile = null;
  tipEl.hidden = true;
  buildRepoScene(state.byId[id]);
  if (!keepCamera) defaultView(true);
  renderAll();
}
function enterTown() {
  state.view = { mode: 'town' };
  state.focusBranch = null; state.hoverBranch = null; state.hoverFile = null;
  tipEl.hidden = true;
  buildTownScene();
  defaultView(false);
  goal.r *= 1; cam.r = goal.r * .7;
  renderAll();
}
function renderAll() { renderCrumbs(); renderSimControls(); renderKpis(); renderLayers(); renderSide(); renderTrace(); $('#feed-scope').textContent = 'All repos'; ui.dirty = false; }

function focusBranch(name) {
  if (!RS) return;
  state.focusBranch = name;
  const s = RS.sites[name];
  if (s) focusOn(s.pos, 80);
  applyHighlights(true);
  renderSide();
}
function focusConflict(key) {
  if (!RS) return;
  const c = collisions(RS.repo).find(x => x.key === key); if (!c) return;
  const A = RS.sites[c.a.name], B = RS.sites[c.b.name];
  if (A && B) focusOn(A.pos.clone().lerp(B.pos, .5), Math.max(70, A.pos.distanceTo(B.pos) * 1.6));
  state.focusBranch = c.a.name;
  applyHighlights(true);
}
function selectCommit(sha) {
  state.selectedSha = sha;
  document.querySelectorAll('.sha').forEach(b => b.classList.toggle('sel', b.dataset.id === sha));
  renderTrace();
  applyHighlights(true);
}
function showInYard() {
  const c = state.selectedSha && state.commits.get(state.selectedSha); if (!c) return;
  if (!curRepo() || curRepo().id !== c.repo) enterRepo(c.repo);
  const b = RS.repo.branches.find(x => x.name === c.branch);
  if (b) focusBranch(b.name);
  else if (c.files.length && RS.fileTop[c.files[0]]) { focusOn(RS.fileTop[c.files[0]], 90); }
  applyHighlights(true);
  for (const fid of c.files) { const f = RS.repo.fileById[fid]; if (f && RS.fileTop[fid]) { f.flash = 1.4; f.flashColor.set(P.ok); pulseAt(RS.fileTop[fid], P.ok); } }
}
function handleClick() {
  const d = pickAt();
  if (!d) { if (state.focusBranch) { state.focusBranch = null; applyHighlights(true); renderSide(); } return; }
  if (d.kind === 'repo') return enterRepo(d.id);
  if (d.kind === 'branch') return focusBranch(d.name);
  if (d.kind === 'conflict') return focusConflict(d.key);
  if (d.kind === 'staged') return selectCommit(d.sha);
  if (d.kind === 'file' && RS) {
    // trace the latest commit that touched this file
    const repo = RS.repo;
    for (let i = repo.log.length - 1; i >= 0; i--) { const c = state.commits.get(repo.log[i]); if (c.files.includes(d.id)) { selectCommit(c.sha); break; } }
  }
  if (d.kind === 'pipe') { const C = state.byId[d.consumer]; return enterRepo(C.id); }
}

/* ---------- click delegation for all HUD controls ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]'); if (!t) return;
  const a = t.dataset.action, id = t.dataset.id;
  switch (a) {
    case 'pause': sim.paused = !sim.paused; renderSimControls(); break;
    case 'speed': sim.speed = +t.dataset.speed; renderSimControls(); break;
    case 'town': enterTown(); break;
    case 'enter-repo': enterRepo(id); break;
    case 'focus-branch': focusBranch(id); break;
    case 'focus-conflict': focusConflict(id); break;
    case 'trace': selectCommit(id); break;
    case 'show-in-yard': showInYard(); break;
    case 'ship': { const r = curRepo(); if (r) doRelease(r, true); ui.dirty = true; break; }
    case 'layer': state.layer = id; recolorFiles(); renderLayers(); break;
    case 'toggle-conflicts': state.showConflicts = !state.showConflicts; if (RS) buildCollisions(RS.repo); renderLayers(); break;
    case 'town-color': state.townColor = id; if (TS) state.repos.forEach(refreshTownBuilding); renderLayers(); break;
    case 'toggle-pipes': state.showPipes = !state.showPipes; buildPipes(); if (!state.showPipes) clearLayer('pipes'); renderLayers(); break;
    case 'zoom-in': goal.r = clamp(goal.r * .75, 30, 520); break;
    case 'zoom-out': goal.r = clamp(goal.r * 1.33, 30, 520); break;
    case 'rotate': goal.theta -= Math.PI / 2; break;
    case 'reset-cam': defaultView(false); break;
  }
  if (e.detail > 0 && t.closest('#side') && document.activeElement && document.activeElement.blur) document.activeElement.blur();
});
$('#side').addEventListener('pointerdown', () => { ui.holdSide = true; });
window.addEventListener('pointerup', () => { if (ui.holdSide) { ui.holdSide = false; ui.dirty = true; } });
$('#side').addEventListener('focusout', () => { if (ui.pendingSide) setTimeout(renderSide, 0); });

/* ---------- resize & theme ---------- */
function resize() {
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stageEl);
function rethemeScene() {
  applyTheme();
  if (state.view.mode === 'repo') enterRepo(state.view.repoId, true); else { buildTownScene(); renderAll(); }
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rethemeScene);
new MutationObserver(rethemeScene).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* ================================================================
   Main loop
   ================================================================ */
let lastT = performance.now(), uiAcc = 0, colorAcc = 0;
function frame(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  const t = now / 1000;
  if (!sim.paused) simTick(dt * sim.speed);
  updateCamera(dt);
  const adt = dt * Math.min(sim.speed, 2.5);
  for (let i = anims.length - 1; i >= 0; i--) {
    const a = anims[i]; a.t += sim.paused ? dt : adt;
    const p = Math.min(1, a.t / a.dur); a.update(p);
    if (p >= 1) { anims.splice(i, 1); if (a.done) a.done(); }
  }
  for (const k in tickers) for (const fn of tickers[k]) fn(t, dt);
  updateEmissive(dt);
  if (RS && RS.dirty && RS.hold === 0 && t - RS.lastRebuild > .4) refreshBranches();
  if (ptr.dirty && ptr.inside && !ptr.down) { ptr.dirty = false; setHover(pickAt()); }
  positionTip();
  renderer.render(scene, camera);
  updateLabels();
  renderClock();
  colorAcc += dt; if (colorAcc > .5) { colorAcc = 0; recolorFiles(); }
  uiAcc += dt;
  if ((ui.dirty && uiAcc > .35) || uiAcc > 1.5) {
    uiAcc = 0; ui.dirty = false;
    renderKpis(); renderSide(); renderTrace();
    if (RS && RS.stageLabel) RS.stageLabel.el.innerHTML = stageLabelHtml(RS.repo);
  }
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
buildRepos();
seedFeed();
applyTheme();
resize();
renderFeed();
enterRepo(state.view.repoId);
sim.nextEventAt = sim.now + 1.2;
// pick up the boot-time running PR checks
for (const r of state.repos) for (const b of r.branches) if (b.pr && b.pr.ci === 'running') {
  after(rnd(2, 6), () => { if (b.pr) { b.pr.ci = 'passing'; if (b.pr.state === 'in_review' && approvals(b.pr) >= 2) b.pr.state = 'approved'; ui.dirty = true; if (RS && RS.repo === r) RS.dirty = true; } });
}
requestAnimationFrame(frame);
})();
</script></body></html>
